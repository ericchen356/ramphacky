display_information:
  name: Haggle
  description: An AI agent swarm that plans your event and negotiates with every vendor at once.
  background_color: "#1a1a2e"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Haggle
    always_online: true
  slash_commands:
    - command: /haggle
      description: Plan an event — Haggle's agents negotiate with every vendor
      usage_hint: 120-person offsite in NYC Oct 20, $40k budget, 20 vegetarian
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - chat:write
      - chat:write.public
      - commands
      - im:history
      - im:read
      - im:write
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
